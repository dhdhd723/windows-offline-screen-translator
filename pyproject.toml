[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-translator"
version = "0.1.1"
description = "Windows offline Chinese-English screen translator"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6==6.9.3",
  "onnxruntime==1.24.4",
  "ctranslate2==4.8.2",
  "sentencepiece==0.2.2",
  "numpy==2.2.6",
  "opencv-python==5.0.0.93",
  "mss==10.2.0",
  "rapidocr==3.9.2",
  "rapidfuzz==3.14.6",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3", "pytest==9.1.1"]
models = ["torch==2.9.1", "transformers==4.57.6", "huggingface-hub==0.36.2", "sacremoses==0.1.1"]

[project.scripts]
screen-translator = "screen_translator.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

